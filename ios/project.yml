# Generate the Xcode project with `xcodegen` (brew install xcodegen), then open BodyLabSync.xcodeproj,
# pick your Team under Signing & Capabilities, and change the bundle ID if it's taken.
name: BodyLabSync
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BodyLabSync:
    type: application
    platform: iOS
    sources: [BodyLabSync]
    entitlements:
      path: BodyLabSync/BodyLabSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: BodyLabSync/Info.plist
      properties:
        CFBundleDisplayName: BodyLab Sync
        NSHealthShareUsageDescription: BodyLab reads weight, nutrition, sleep, activity and workouts to show how they change your body.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.redreceipt.bodylab.sync
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
