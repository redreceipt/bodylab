# Generate the Xcode project with `BODYLAB_TEAM=<your team id> xcodegen` (brew install xcodegen), open
# BodyLabSync.xcodeproj and run it on your iPhone. Change the bundle ID if it's taken.
name: BodyLabSync
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BodyLabSync:
    type: application
    platform: iOS
    sources: [BodyLabSync]
    entitlements:
      path: BodyLabSync/BodyLabSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: BodyLabSync/Info.plist
      properties:
        CFBundleDisplayName: BodyLab
        NSHealthShareUsageDescription: BodyLab reads weight, nutrition, sleep, activity and workouts to show how they change your body.
        NSHealthUpdateUsageDescription: BodyLab saves the food, weight and workouts you log so every app sees them.
        NSCameraUsageDescription: BodyLab uses a face photo or a Face ID camera scan to make your 3D body look like you. It stays on your BodyLab server.
        CFBundleURLTypes:
          - CFBundleURLName: bodylab-pairing
            CFBundleURLSchemes: [bodylab]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.redreceipt.bodylab.sync
        DEVELOPMENT_TEAM: ${BODYLAB_TEAM}  # BODYLAB_TEAM=<your team id> xcodegen
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # icon and launch mark: uv run python tools/brand.py
