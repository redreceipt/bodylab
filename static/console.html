<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BodyLab · console</title>
<link rel="icon" href="/static/assets/icon.png">
<style>
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; background: #0b1120; color: #e6edf7 }
  header { padding: 14px 24px; border-bottom: 1px solid #1d2a44; display: flex; justify-content: space-between; align-items: center }
  header b { letter-spacing: .2em } header b span { color: #3ef0ff } a { color: #3ef0ff }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; padding: 16px 24px }
  section { background: #111a2e; border: 1px solid #1d2a44; border-radius: 10px; padding: 14px 16px }
  h2 { font-size: 15px; margin: 0 0 10px } .muted { color: #8796ad; font-size: 12.5px }
  table { border-collapse: collapse; width: 100% } td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #1d2a44; font-size: 13px }
  label { display: block; margin: 6px 0 } input, select { font: inherit; color: inherit; background: #0b1120; border: 1px solid #2a3a5c; border-radius: 6px; padding: 5px 7px; width: 100%; box-sizing: border-box }
  input[type=checkbox] { width: auto } button { font: inherit; color: #e6edf7; background: #16314a; border: 1px solid #2f6a8a; border-radius: 6px; padding: 6px 12px; cursor: pointer }
  small { display: block; color: #8796ad } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px } .thumbs img { height: 96px; border-radius: 4px; background: #222 }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 6px }
  .dot.scanning { background: #3eff9f } .dot.adjust { background: #ffc65c } .dot.offline, .dot.error { background: #ff5c6c }
  #preview img { width: 100%; border-radius: 6px; background: #000 } #toast { position: fixed; bottom: 16px; right: 16px; background: #16314a; padding: 8px 14px; border-radius: 8px; display: none }
</style>
</head>
<body>
<header><b>BODY<span>LAB</span> · console</b><a href="/?app=1">the app's view →</a></header>
<main id="main"><section><p class="muted">Loading…</p></section></main>
<div id="toast"></div>
<script type="module" src="/static/console.js"></script>
</body>
</html>
