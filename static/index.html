<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BodyLab</title>
<script type="importmap">{"imports": {"three": "/static/vendor/three.module.js", "three/addons/": "/static/vendor/"}}</script>
<style>
:root { --bg:#060a13; --panel:rgba(13,19,33,.88); --line:rgba(120,200,255,.16); --fg:#e6f1ff; --dim:#8399b3; --acc:#3ef0ff; --good:#4cff9a; --bad:#ff6b6b; }
* { box-sizing: border-box }
html, body { margin:0; height:100%; overflow:hidden; color:var(--fg); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: radial-gradient(ellipse at 50% 35%, #142440 0%, var(--bg) 65%) }
#c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(12px) }
button, input, select { font:inherit; color:inherit }
button { background:rgba(62,240,255,.12); border:1px solid rgba(62,240,255,.45); border-radius:9px; padding:7px 12px; cursor:pointer }
button:hover { background:rgba(62,240,255,.24) }
button.link { background:none; border:none; color:var(--dim); padding:0 4px; font-size:12px; text-decoration:underline }
input, select { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; min-width:0 }
input:focus, select:focus, button:focus-visible { outline:2px solid var(--acc); outline-offset:1px }
h2 { margin:0 0 12px; font-size:20px } h3 { margin:16px 0 8px; font-size:15px } h4 { margin:14px 0 4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.1em }
p { margin:6px 0 } .muted { color:var(--dim); font-size:12.5px } .good { color:var(--good) } .bad { color:var(--bad) }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px }

#hud { position:fixed; top:16px; left:16px; width:230px; display:flex; flex-direction:column; gap:9px }
.brand { font-weight:800; letter-spacing:.24em; font-size:17px; padding:2px 4px 6px } .brand b { color:var(--acc) }
.stat { padding:9px 14px; cursor:pointer; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100% }
.stat:hover { border-color:var(--acc); background:var(--panel) }
.stat .k { color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.14em }
.stat .v { font-size:23px; font-weight:700; font-variant-numeric:tabular-nums } .stat .d { font-size:12px; font-weight:500; margin-left:8px }

#cam { position:fixed; top:16px; right:16px; width:300px; padding:8px; display:flex; flex-direction:column; gap:7px; transition:width .2s }
#cam.big { width:min(720px, 60vw) }
#live { width:100%; max-height:44vh; object-fit:contain; border-radius:9px; background:#000; cursor:zoom-in; display:block }
#cam.big #live { cursor:zoom-out }
#camMsg { font-size:12.5px; flex:1 }
#dot { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none }
#dot.scanning, #dot.live { background:var(--acc); animation:pulse 1s infinite } #dot.saved, #dot.done { background:var(--good) }
#dot.adjust { background:#ffc65c } #dot.offline, #dot.error { background:var(--bad) }
@keyframes pulse { 50% { opacity:.3 } }
.bar { height:5px; background:rgba(255,255,255,.07); border-radius:3px; overflow:hidden; display:flex }
.bar i { display:block; height:100%; background:var(--acc); transition:width .3s } .bar i + i { background:var(--good) }

#nav { position:fixed; left:16px; bottom:16px; display:flex; flex-direction:column; gap:8px }
#nav button { width:130px; text-align:left; background:var(--panel); border-color:var(--line) }
#nav button[aria-pressed=true] { border-color:var(--acc) }

#timeline { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); padding:9px 16px; display:flex; align-items:center; gap:14px; width:min(560px, 46vw) }
#timeline input[type=range] { flex:1; accent-color:var(--acc); padding:0; border:none; background:none }
#timeline label { display:flex; gap:6px; align-items:center; white-space:nowrap; font-size:12.5px; color:var(--dim) }
#timeline label input { width:auto }
#scanLabel { white-space:nowrap; font-size:12.5px; font-variant-numeric:tabular-nums }
#liveTag { color:var(--bad); font-weight:700; font-size:12px; letter-spacing:.1em; animation:pulse 1.2s infinite }

#panel { position:fixed; top:16px; right:16px; bottom:16px; width:420px; padding:20px 20px 24px; overflow:auto; z-index:2 }
#close { position:absolute; top:12px; right:12px; padding:2px 10px }
.metric { border-top:1px solid var(--line); padding:12px 0 }
.metric:first-child, h2 + .metric { border-top:none; padding-top:0 }
.metric h3 { margin:0 } .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums }
.spark { width:100%; height:80px; margin:6px 0 } .spark polyline { fill:none; stroke:var(--acc); stroke-width:2 } .spark circle { fill:var(--acc) }
.spark line { stroke:var(--good); stroke-dasharray:4 4 }
.goal { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px; padding:9px 11px; display:flex; flex-direction:column; gap:6px }
.goal .bar i { background:var(--good) }
form.inline { display:flex; gap:8px; margin-top:8px } form.inline button { white-space:nowrap }
form.stack { display:flex; flex-direction:column; gap:9px; padding:4px 0 10px; border-bottom:1px solid var(--line) }
label { font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:3px }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:9px }
.chips { border:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:6px }
.chips label { flex-direction:row; align-items:center; gap:5px; color:var(--fg); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:20px; padding:4px 10px; cursor:pointer; text-transform:capitalize }
.chips input { width:auto; accent-color:var(--acc) }
ul.list { list-style:none; padding:0; margin:0; font-size:12.5px } ul.list li { padding:6px 0; border-bottom:1px solid var(--line) }
ul.list li span { color:var(--dim) }
.callout { background:rgba(62,240,255,.06); border:1px solid rgba(62,240,255,.3); border-radius:12px; padding:10px 14px }
.chart { width:100%; margin-top:12px } .chart rect { fill:rgba(62,240,255,.35) } .chart polyline { fill:none; stroke:var(--good); stroke-width:2.5 }
.chart circle { fill:var(--good) } .chart text { fill:var(--dim); font-size:9px; text-anchor:middle }
.legend { display:flex; gap:14px; font-size:11.5px; color:var(--dim); align-items:center }
.legend i { display:inline-block; width:12px; height:8px; margin-right:5px; background:rgba(62,240,255,.5) } .legend i.l { height:3px; background:var(--good) }
table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; margin-top:10px }
td, th { white-space:nowrap; padding:5px 4px; border-bottom:1px solid var(--line); text-align:right } td:first-child, th:first-child { text-align:left }
th { color:var(--dim); font-weight:500 }
code { font:12px ui-monospace, monospace; word-break:break-all; white-space:normal; color:var(--acc) }
ul.tips { padding-left:18px; color:var(--dim); font-size:12.5px }
#tip { position:fixed; pointer-events:none; padding:6px 10px; border-radius:8px; background:var(--panel); border:1px solid var(--acc); font-size:12.5px; display:none; z-index:3 }
#toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); padding:9px 16px; border-radius:10px; background:var(--panel); border:1px solid var(--good); display:none; z-index:4 }
#toast.err { border-color:var(--bad) }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D body model. Click a body part for details."></canvas>
<header id="hud"><div class="brand">BODY<b>LAB</b></div><div id="stats" style="display:contents"></div></header>
<aside id="cam" class="card">
  <img id="live" alt="Live camera with body tracking overlay">
  <div class="row"><span id="dot"></span><span id="camMsg" role="status">Connecting…</span></div>
  <div class="row"><div class="bar" style="flex:1" title="front / side scan progress"><i id="barF" style="width:0"></i><i id="barS" style="width:0"></i></div>
    <button id="rescan" title="Allow a new saved scan now">Rescan</button></div>
</aside>
<nav id="nav">
  <button data-tab="log">＋ Log inputs</button>
  <button data-tab="insights">⟲ Insights</button>
  <button data-tab="goals">◎ Goals</button>
  <button data-tab="profile">⚙ Profile</button>
</nav>
<footer id="timeline" class="card">
  <span id="liveTag" hidden>● LIVE</span>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scan history">
  <span id="scanLabel"></span>
  <label><input type="checkbox" id="ghost" checked> first-scan ghost</label>
</footer>
<section id="panel" class="card" hidden><button id="close" aria-label="Close">×</button><div id="pbody"></div></section>
<div id="tip"></div><div id="toast" role="alert"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
