[project]
name = "bodylab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
]

[tool.uv]
package = false

[dependency-groups]
fit = [
    "anny>=0.6.2",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
]  # body-shape fitting (PyTorch); optional: uv run --group fit
vision = [
    "mlx-vlm>=0.7.4,<0.8",
]
